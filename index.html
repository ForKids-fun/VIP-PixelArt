<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pixel Art Studio VIP</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f4f6; /* stays SAME for all themes */
      color: #222;
      text-align: center;
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 2rem;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
    }

    select, button, input[type="color"] {
      padding: 8px 12px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      cursor: pointer;
      background: white;
    }

    #grid {
      display: grid;
      justify-content: center;
      margin: 0 auto 30px;
      gap: 1px;
      user-select: none;
    }

    .pixel {
      width: 20px;
      height: 20px;
      background: white;
      border: 1px solid #ddd;
    }

    .vip-tag {
      margin-top: 4px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <h1>Pixel Art Studio <span style="font-weight:500;">VIP</span></h1>
  <div class="vip-tag">Premium tools · No watermark · Pro quality</div>

  <div class="toolbar">
    <input type="color" id="colorPicker" value="#222222" />

    <select id="themeSelect"></select>

    <button id="clearBtn">Clear</button>
    <button id="saveBtn">Save PNG</button>
  </div>

  <div id="grid"></div>

  <canvas id="exportCanvas" style="display:none;"></canvas>

  <script src="script.js"></script>
</body>
</html>
